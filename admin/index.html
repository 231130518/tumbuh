<!doctype html>
<!-- Login admin melalui Supabase Authentication; membership admin_users diperiksa setelah login. -->
<html lang="id">
  <head>
    <!-- Loader awal menyiapkan tampilan sebelum body dibaca. Script fitur halaman memakai defer di bagian bawah. -->
    <script src="../js/loading.js"></script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Login Admin — TUMBUH</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css"
    />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="icon" type="image/png" href="../assets/logo-tumbuh.png?v=20261108" />
    <link rel="apple-touch-icon" href="../assets/logo-tumbuh.png?v=20261108" />
  </head>
  <body data-page="admin-login">
    <!-- Header diisi main.js supaya navigasi konsisten di seluruh halaman. -->
    <div id="site-header"></div>
    <main class="section login-page">
      <!-- Email/password dikirim ke Auth oleh admin.js; tidak ada kredensial admin di HTML. -->
      <form class="form-card login-card" id="admin-login-form">
        <span class="eyebrow">RUANG ADMIN</span>
        <h3>Selamat datang kembali.</h3>
        <p class="body-muted">Masuk untuk meninjau dan mengelola artikel TUMBUH.</p>
        <div class="field">
          <label for="admin-email">Email</label
          ><input
            id="admin-email"
            name="email"
            type="email"
            required
            placeholder="Email admin"
            autocomplete="username"
          />
        </div>
        <div class="field login-password">
          <label for="admin-password">Password</label
          ><input
            id="admin-password"
            name="password"
            required
            type="password"
            placeholder="Password admin"
            autocomplete="current-password"
          />
        </div>
        <button class="btn" type="submit" id="admin-login-submit" disabled>
          Masuk ke Dashboard ↗
        </button>
        <div class="notice" id="login-note" role="status" aria-live="polite" hidden></div>
        <noscript><p class="notice">Aktifkan JavaScript untuk login admin.</p></noscript>
      </form>
    </main>
    <!-- Script defer dieksekusi sesuai urutan setelah HTML dibaca. Pertahankan SDK/config/client sebelum modul yang memakainya. -->
    <script src="../js/main.js" defer></script>
    <script src="../js/vendor/supabase-2.119.0.js" defer></script>
    <script src="../js/supabase-config.js" defer></script>
    <script src="../js/supabase-client.js" defer></script>
    <script src="../js/admin.js" defer></script>
    <script
      src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"
      defer
    ></script>
    <script src="../js/aos-tumbuh.js" defer></script>
  </body>
</html>
