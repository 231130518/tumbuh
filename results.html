<!doctype html>
<!-- Alias URL lama. Pengalihan inline tidak menunggu unduhan JS/CSS dan tidak menampilkan halaman perantara. -->
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>TUMBUH</title>
    <style>html { background: #f7f9f3; }</style>
    <script>
      // Langsung berpindah tanpa menunggu file JS, CSS, atau gambar.
      const destination = new URL("hasil-pemeriksaan/", location.href);
      /**
       * Pertahankan query seperti id/next dan hash tujuan; replace tidak menambah alias ke riwayat Back.
       */
      destination.search = location.search;
      destination.hash = location.hash;
      location.replace(destination.href);
    </script>
  </head>
  <body>
    <!-- Tautan manual hanya terlihat jika JavaScript dinonaktifkan. -->
    <noscript><p><a href="hasil-pemeriksaan/">Buka halaman TUMBUH</a></p></noscript>
  </body>
</html>
