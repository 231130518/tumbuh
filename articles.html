<!doctype html>
<html lang="id">
  <head>
    <script src="js/loading.js"></script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Semua Artikel — TUMBUH</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page="articles">
    <div id="site-header"></div>
    <main>
      <section class="page-hero">
        <div class="wrap">
          <span class="eyebrow light">RUANG EDUKASI</span>
          <h1>Cerita dan pengetahuan<br />untuk tumbuh bersama.</h1>
          <p>
            Temukan inspirasi dan informasi untuk menemani perjalanan tumbuh
            kembang si kecil.
          </p>
        </div>
      </section>
      <section class="inner-page">
        <div class="wrap">
          <label class="searchbar"
            >⌕
            <input
              type="search"
              id="article-search"
              aria-label="Cari artikel"
              placeholder="Cari topik atau judul artikel..."
          /></label>
          <div class="articles-grid" id="article-list"></div>
        </div>
      </section>
    </main>
    <div id="site-footer"></div>
    <script src="js/main.js" defer></script>
    <script src="js/review.js" defer></script>
    <script
      src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"
      defer
    ></script>
    <script src="js/aos-tumbuh.js" defer></script>
  </body>
</html>
