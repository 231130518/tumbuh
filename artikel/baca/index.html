<!doctype html>
<!-- Halaman baca satu artikel; ID berasal dari query URL dan isi disanitasi sebelum ditampilkan. -->
<html lang="id">
  <head>
    <!-- Loader awal menyiapkan tampilan sebelum body dibaca. Script fitur halaman memakai defer di bagian bawah. -->
    <script src="../../js/loading.js"></script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Isi Artikel — TUMBUH</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css"
    />
    <link rel="stylesheet" href="../../css/style.css" />
    <link rel="icon" type="image/png" href="../../assets/logo-tumbuh.png?v=20261108" />
    <link rel="apple-touch-icon" href="../../assets/logo-tumbuh.png?v=20261108" />
  </head>
  <body data-page="article">
    <!-- Header diisi main.js supaya navigasi konsisten di seluruh halaman. -->
    <div id="site-header"></div>
    <main>
      <section class="article-hero" aria-labelledby="article-hero-title">
        <div class="wrap article-hero-inner">
          <div class="article-breadcrumb">BERANDA / ARTIKEL EDUKASI</div>
          <!-- Placeholder judul diganti setelah ID dan status published terverifikasi. -->
          <h1 id="article-hero-title">Memuat artikel…</h1>
          <p id="article-hero-subtitle" class="article-hero-subtitle"></p>
          <p id="article-hero-meta" class="article-hero-meta"></p>
        </div>
        <div class="article-hero-rings" aria-hidden="true"></div>
      </section>
      <div class="article-cover-banner" hidden>
        <img
          id="article-cover-image"
          alt="Ilustrasi untuk artikel edukasi TUMBUH"
        />
      </div>
      <section class="article-content-section">
        <div class="wrap article-layout">
          <!-- HTML artikel hanya dipasang setelah melewati sanitizer. -->
          <article class="article-detail" id="article-detail"></article>
          <!-- Rekomendasi dimuat terpisah agar kegagalannya tidak menghapus artikel utama. -->
          <aside
            class="article-latest"
            hidden
            aria-label="Bacaan pilihan dan artikel lainnya"
          >
            <h2 class="article-latest-title">Bacaan pilihan</h2>
            <p class="article-latest-subtitle">
              Pilihan artikel untuk menemani keluarga.
            </p>
            <div
              id="article-recommendations"
              class="article-latest-items"
            ></div>
            <div class="article-latest-cta">
              <h3>Tumbuh bersama informasi.</h3>
              <p>
                Temukan lebih banyak bacaan edukasi untuk mendampingi
                pertumbuhan si kecil.
              </p>
              <a href="../">Jelajahi artikel ↗</a>
            </div>
          </aside>
        </div>
      </section>
    </main>
    <!-- Footer bersama diisi main.js; bukan salinan markup yang perlu diedit pada tiap halaman. -->
    <div id="site-footer"></div>
    <!-- Script defer dieksekusi sesuai urutan setelah HTML dibaca. Pertahankan SDK/config/client sebelum modul yang memakainya. -->
    <script src="../../js/main.js" defer></script>
    <script src="../../js/vendor/supabase-2.119.0.js" defer></script>
    <script src="../../js/vendor/purify-3.4.17.min.js" defer></script>
    <script src="../../js/supabase-config.js" defer></script>
    <script src="../../js/supabase-client.js" defer></script>
    <script src="../../js/article-content.js" defer></script>
    <script src="../../js/article-loading.js" defer></script>
    <script src="../../js/public-articles.js" defer></script>
    <script
      src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"
      defer
    ></script>
    <script src="../../js/aos-tumbuh.js" defer></script>
  </body>
</html>
