<!doctype html>
<!-- Daftar artikel published: pencarian dan pagination diisi public-articles.js. -->
<html lang="id">
  <head>
    <!-- Loader awal menyiapkan tampilan sebelum body dibaca. Script fitur halaman memakai defer di bagian bawah. -->
    <script src="../js/loading.js"></script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Semua Artikel — TUMBUH</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css"
    />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="icon" type="image/png" href="../assets/logo-tumbuh.png?v=20261108" />
    <link rel="apple-touch-icon" href="../assets/logo-tumbuh.png?v=20261108" />
  </head>
  <body data-page="articles">
    <!-- Header diisi main.js supaya navigasi konsisten di seluruh halaman. -->
    <div id="site-header"></div>
    <main>
      <section class="page-hero">
        <div class="wrap">
          <span class="eyebrow light">RUANG EDUKASI</span>
          <h1>Cerita dan pengetahuan<br />untuk tumbuh bersama.</h1>
          <p>
            Temukan inspirasi dan informasi untuk menemani perjalanan tumbuh
            kembang si kecil.
          </p>
        </div>
      </section>
      <section class="inner-page">
        <div class="wrap">
          <label class="searchbar"
            >⌕
            <input
              type="search"
              id="article-search"
              maxlength="100"
              aria-label="Cari artikel"
              placeholder="Cari topik atau judul artikel..."
          /></label>
          <!-- Daftar artikel diganti oleh hasil request; aria-live membantu pembaca layar. -->
          <div class="articles-grid" id="article-list" aria-live="polite"><p role="status">Memuat artikel…</p></div>
          <!-- Kontrol pagination diperbarui berdasarkan jumlah artikel yang dikembalikan server. -->
          <nav class="public-pagination" id="public-pagination" aria-label="Halaman artikel" hidden>
            <button class="btn outline" id="public-prev" type="button">← Sebelumnya</button>
            <span id="public-page-label"></span>
            <button class="btn outline" id="public-next" type="button">Berikutnya →</button>
          </nav>
        </div>
      </section>
    </main>
    <!-- Footer bersama diisi main.js; bukan salinan markup yang perlu diedit pada tiap halaman. -->
    <div id="site-footer"></div>
    <!-- Script defer dieksekusi sesuai urutan setelah HTML dibaca. Pertahankan SDK/config/client sebelum modul yang memakainya. -->
    <script src="../js/main.js" defer></script>
    <script src="../js/vendor/supabase-2.119.0.js" defer></script>
    <script src="../js/vendor/purify-3.4.17.min.js" defer></script>
    <script src="../js/supabase-config.js" defer></script>
    <script src="../js/supabase-client.js" defer></script>
    <script src="../js/article-content.js" defer></script>
    <script src="../js/article-loading.js" defer></script>
    <script src="../js/public-articles.js" defer></script>
    <script
      src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"
      defer
    ></script>
    <script src="../js/aos-tumbuh.js" defer></script>
  </body>
</html>
